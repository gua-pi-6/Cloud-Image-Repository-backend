spring:
  session:
    store-type: redis
    timeout: 2592000
  application:
    name: shared-picture-platform
    # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    password: 1234
    port: 6379
    timeout: 5000
    username: default

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shared_picture_platform
    username: root
    password: 88888888
  # 运行环境
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
server:
  # 端口号
  port: 8123
  servlet:
    # 根路径
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 取消驼峰命名映射
    map-underscore-to-camel-case: false
    # 开启日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 删除字段
      logic-delete-value: 1 # 删除值
      logic-not-delete-value: 0 # 未删除值

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.chen.controller
